# local coding bake-off: bake-off llama-swap, lane all (4 cards, 44 GB). One model at a time.
# -ot placement: first match wins. "hot" = attention, router, shared expert, norms, embeddings and KV on the
# RTX 4000s (fastest memory, 416 GB/s; read on every token); routed experts on P5000 + A2000 (288 GB/s).
healthCheckTimeout: 900
sendLoadingState: false
globalTTL: 900
models:
  coder-next:
    cmd: >-
      llama-server --host 127.0.0.1 --port ${PORT} --no-webui -ngl all --fit off -fa on -ctk q8_0 -ctv q8_0 --jinja -m /scratchmodels/Qwen3-Coder-Next-UD-IQ4_XS.gguf -c 65536 -np 1 --temp 1.0 --top-p 0.95 --top-k 40 --min-p 0.01 --split-mode layer --tensor-split 16,8,8,12
  coder-next-hot:
    cmd: >-
      llama-server --host 127.0.0.1 --port ${PORT} --no-webui -ngl all --fit off -fa on -ctk q8_0 -ctv q8_0 --jinja -m /scratchmodels/Qwen3-Coder-Next-UD-IQ4_XS.gguf -c 65536 -np 1 --temp 1.0 --top-p 0.95 --top-k 40 --min-p 0.01 --split-mode layer --tensor-split 0,1,1,0
      -ot "blk\.([0-9]|1[0-9])\.ffn_.*_exps\.=CUDA0,blk\.(2[0-9]|3[0-3])\.ffn_.*_exps\.=CUDA3,blk\.(3[4-9]|40)\.ffn_.*_exps\.=CUDA1,blk\.(4[1-7])\.ffn_.*_exps\.=CUDA2"
  qwen36-35b:
    cmd: >-
      llama-server --host 127.0.0.1 --port ${PORT} --no-webui -ngl all --fit off -fa on -ctk q8_0 -ctv q8_0 --jinja -m /scratchmodels/Qwen3.6-35B-A3B-UD-Q6_K.gguf -c 65536 -np 1 --temp 0.6 --top-p 0.95 --top-k 20 --presence-penalty 0.0 --split-mode layer --tensor-split 16,8,8,12
  qwen36-35b-hot:
    cmd: >-
      llama-server --host 127.0.0.1 --port ${PORT} --no-webui -ngl all --fit off -fa on -ctk q8_0 -ctv q8_0 --jinja -m /scratchmodels/Qwen3.6-35B-A3B-UD-Q6_K.gguf -c 65536 -np 1 --temp 0.6 --top-p 0.95 --top-k 20 --presence-penalty 0.0 --split-mode layer --tensor-split 0,1,1,0
      -ot "blk\.([0-9]|1[0-9])\.ffn_.*_exps\.=CUDA0,blk\.(2[0-9]|3[0-3])\.ffn_.*_exps\.=CUDA3"
  qwen3-coder-30b:
    cmd: >-
      llama-server --host 127.0.0.1 --port ${PORT} --no-webui -ngl all --fit off -fa on -ctk q8_0 -ctv q8_0 --jinja -m /models/bakeoff/Qwen3-Coder-30B-A3B-Instruct-UD-Q4_K_XL.gguf -c 32768 -np 1 --temp 0.7 --top-p 0.8 --top-k 20 --repeat-penalty 1.05 --split-mode layer --tensor-split 16,8,8,12
